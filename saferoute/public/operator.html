<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dog Operator</title>
    <meta name="description" content="Operator overrides for the MechDog: force go, steer, stop, arm. Keep off the demo screen." />
    <style>
      :root {
        --bg: #f4f4f2;
        --panel: #ffffff;
        --fg: #16181c;
        --muted: #6a6f78;
        --line: #dcdcd8;
        --go: #147a3c;
        --stop: #c0262d;
        --key: #ecebe7;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #111214;
          --panel: #1a1c20;
          --fg: #ececea;
          --muted: #9a9ea6;
          --line: #2c2f35;
          --go: #3fb96b;
          --stop: #ff5d63;
          --key: #24272c;
        }
      }
      :root[data-theme="dark"] {
        --bg: #111214;
        --panel: #1a1c20;
        --fg: #ececea;
        --muted: #9a9ea6;
        --line: #2c2f35;
        --go: #3fb96b;
        --stop: #ff5d63;
        --key: #24272c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px 16px 32px;
        display: grid;
        gap: 14px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 650;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .status {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .status div span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .status b {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      #state.walk {
        color: var(--go);
      }
      #state.offline {
        color: var(--stop);
      }
      .pad {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
      button {
        font: 600 16px/1.2 inherit;
        font-family: inherit;
        color: var(--fg);
        background: var(--key);
        border: 1px solid var(--line);
        border-radius: 10px;
        min-height: 84px;
        cursor: pointer;
        touch-action: none;
        display: grid;
        place-items: center;
        gap: 2px;
        padding: 10px;
      }
      button kbd {
        font: 600 12px ui-monospace, monospace;
        color: var(--muted);
      }
      button.held {
        outline: 3px solid var(--fg);
        outline-offset: -3px;
      }
      #fwd {
        background: var(--go);
        border-color: var(--go);
        color: #fff;
      }
      #fwd kbd,
      #stop kbd {
        color: rgba(255, 255, 255, 0.8);
      }

      #stop {
        grid-column: 1 / -1;
        background: var(--stop);
        border-color: var(--stop);
        color: #fff;
        min-height: 72px;
      }
      #arm,
      #cross {
        min-height: 52px;
      }
      #cross {
        grid-column: 1 / 3;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button:focus-visible {
        outline: 3px solid var(--fg);
        outline-offset: 2px;
      }
      .timer {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 14px;
      }
      .timer label {
        flex: 1;
        color: var(--muted);
        font-size: 13px;
      }
      .timer input {
        width: 96px;
        font: 600 16px ui-monospace, monospace;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        -webkit-user-select: text;
        user-select: text;
      }
      #timerLeft {
        min-width: 92px;
        text-align: right;
        font: 700 18px ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .tune {
        display: grid;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .tune label {
        display: grid;
        grid-template-columns: 110px 64px 1fr;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .tune b {
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }
      .modes {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modes button {
        min-height: 40px;
        padding: 6px 14px;
        font-size: 14px;
      }
      .modes button.on {
        outline: 3px solid var(--fg);
        outline-offset: -3px;
      }
      .tune .rev {
        display: flex;
        color: var(--fg);
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        font: 13px ui-monospace, monospace;
        color: var(--muted);
        max-height: 140px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Dog operator</h1>
        <span class="muted">Keep this off the demo screen</span>
      </header>

      <section class="status" aria-live="polite">
        <div><span>State</span><b id="state">–</b></div>
        <div><span>Sonar</span><b id="sonar">–</b></div>
        <div><span>Steer</span><b id="steer">straight</b></div>
        <div><span>Detection</span><b id="armed">–</b></div>
        <div><span>Robot</span><b id="link">–</b></div>
        <div><span>Battery</span><b id="batt">–</b></div>
      </section>

      <section class="timer">
        <label for="timer">Auto-go after Arm</label>
        <input id="timer" type="number" min="0" max="120" step="0.01" placeholder="off" />
        <span>s</span>
        <b id="timerLeft" aria-live="polite">off</b>
      </section>

      <section class="tune">
        <div class="modes">
          <button id="tableMode" type="button">Table demo</button>
          <button id="streetMode" type="button">Street</button>
          <span id="modeInfo" class="muted">–</span>
        </div>
        <label>Body pitch <b id="pitchV">0°</b><input id="pitch" type="range" min="-15" max="15" step="1" value="0" /></label>
        <label>Body height <b id="heightV">80 mm</b><input id="height" type="range" min="50" max="120" step="5" value="80" /></label>
        <label>Body shift <b id="shiftV">0 mm</b><input id="shift" type="range" min="-25" max="25" step="5" value="0" /></label>
        <label class="rev"><input id="reverse" type="checkbox" /> Walk backwards (crossing and W)</label>
      </section>

      <section class="pad">
        <span></span>
        <button id="fwd" data-key="w" aria-label="Forward (hold)">▲ Forward<kbd>hold W</kbd></button>
        <span></span>
        <button id="left" data-key="a" aria-label="Turn left (hold)">◀ Left<kbd>hold A</kbd></button>
        <button id="back" data-key="s" aria-label="Backward (hold)">▼ Back<kbd>hold S</kbd></button>
        <button id="right" data-key="d" aria-label="Turn right (hold)">Right ▶<kbd>hold D</kbd></button>
        <button id="stop" aria-label="Stop">Stop<kbd>Space</kbd></button>
        <button id="cross" aria-label="Start a crossing">Start crossing<kbd>G</kbd></button>
        <button id="arm" aria-label="Arm or disarm detection">Arm detection<kbd>R</kbd></button>
      </section>

      <ol id="log"></ol>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      let settings = {};

      function log(text) {
        const li = document.createElement("li");
        li.textContent = new Date().toLocaleTimeString([], { hour12: false }) + "  " + text;
        $("log").prepend(li);
        while ($("log").children.length > 30) $("log").lastChild.remove();
      }
      const command = (cmd, extra = {}) =>
        fetch("/api/dog/command", { method: "POST", body: JSON.stringify({ cmd, ...extra }) }).catch(() =>
          log("agent not reachable"),
        );

      // Manual driving: while any of W A S D is held (keyboard or button), send {stride, angle} every 150 ms; the
      // agent drops a drive it hasn't heard for 0.7 s, and one "all released" drive stops the dog at once.
      const STRIDE = 80,
        TURN = 20;
      const held = new Set();
      let driving = false;
      function driveCmd() {
        const stride = (held.has("w") ? STRIDE : 0) - (held.has("s") ? STRIDE : 0);
        const angle = (held.has("a") ? TURN : 0) - (held.has("d") ? TURN : 0);
        return { stride, angle };
      }
      function sendDrive() {
        const d = driveCmd();
        if (d.stride || d.angle) {
          command("drive", d);
          driving = true;
        } else if (driving) {
          command("drive", d);
          driving = false;
        }
        for (const b of document.querySelectorAll("[data-key]")) b.classList.toggle("held", held.has(b.dataset.key));
        $("steer").textContent = d.stride || d.angle ? `stride ${d.stride} · turn ${d.angle}` : "straight";
      }
      setInterval(() => held.size && sendDrive(), 150);
      function press(k) {
        if (held.has(k)) return;
        held.add(k);
        sendDrive();
      }
      function release(k) {
        if (!held.delete(k)) return;
        sendDrive();
      }

      function stop() {
        held.clear();
        sendDrive();
        command("end");
        log("STOP");
      }
      async function toggleArm() {
        try {
          const r = await fetch("/api/dog/settings", {
            method: "POST",
            body: JSON.stringify({ paused: !settings.paused }),
          });
          settings = await r.json();
          log(settings.paused ? "detection disarmed" : "detection ARMED");
        } catch {
          log("agent not reachable");
        }
      }

      $("timer").onchange = async (e) => {
        const v = parseFloat(e.target.value) || 0;
        try {
          const r = await fetch("/api/dog/settings", { method: "POST", body: JSON.stringify({ go_timer_s: v }) });
          settings = await r.json();
          log(v ? `auto-go ${v} s after Arm` : "auto-go off");
        } catch {
          log("agent not reachable");
        }
      };
      $("cross").onclick = () => {
        command("go");
        log("start crossing");
      };
      $("stop").onclick = stop;
      async function setting(patch) {
        try {
          const r = await fetch("/api/dog/settings", { method: "POST", body: JSON.stringify(patch) });
          settings = await r.json();
        } catch {
          log("agent not reachable");
        }
      }
      $("pitch").oninput = (e) => ($("pitchV").textContent = e.target.value + "°");
      $("pitch").onchange = (e) => {
        setting({ pitch: +e.target.value });
        log("pitch " + e.target.value + "°");
      };
      $("height").oninput = (e) => ($("heightV").textContent = e.target.value + " mm");
      $("height").onchange = (e) => {
        setting({ height: +e.target.value });
        log("height " + e.target.value + " mm");
      };
      $("shift").oninput = (e) => ($("shiftV").textContent = e.target.value + " mm");
      $("shift").onchange = (e) => {
        setting({ shift: +e.target.value });
        log("body shift " + e.target.value + " mm");
      };
      // Table demo: stop 25 cm before the "far curb" object at the end of the table and celebrate, never walk more
      // than 8 s (can't run off the edge). Street: a crossing ends only on Stop, 180 s cap.
      $("tableMode").onclick = () => {
        setting({ target: "walk_signal", finish_cm: 25, cross_max_s: 60, reverse: false, go_timer_s: 0 });
        log("TABLE demo: Gemini starts it (timer off), stops 25 cm before the far object, max 8 s");
      };
      $("streetMode").onclick = () => {
        setting({ finish_cm: 0, cross_max_s: 180, celebration: "paw" });
        log("STREET: walks until Stop (180 s cap)");
      };
      $("reverse").onchange = (e) => {
        setting({ reverse: e.target.checked });
        log(e.target.checked ? "walking BACKWARDS" : "walking forwards");
      };
      $("arm").onclick = toggleArm;
      for (const b of document.querySelectorAll("[data-key]")) {
        b.addEventListener("pointerdown", (e) => {
          b.setPointerCapture(e.pointerId);
          press(b.dataset.key);
        });
        for (const ev of ["pointerup", "pointercancel", "lostpointercapture"])
          b.addEventListener(ev, () => release(b.dataset.key));
      }

      addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey || document.activeElement === $("timer")) return;
        const k = e.key.toLowerCase();
        if ("wasd".includes(k) && k.length === 1) {
          e.preventDefault();
          press(k);
        } else if (e.repeat) return;
        else if (k === " ") {
          e.preventDefault();
          stop();
        } else if (k === "g") $("cross").click();
        else if (k === "r") toggleArm();
      });
      addEventListener("keyup", (e) => release(e.key.toLowerCase()));
      addEventListener("blur", () => {
        held.clear();
        sendDrive();
      });

      async function poll() {
        try {
          const r = await fetch("/api/dog/status", { cache: "no-store" });
          if (!r.ok) throw new Error();
          const s = await r.json();
          const st = s.status || {};
          settings = s.settings || settings;
          $("state").textContent = st.state || "–";
          $("state").className = st.state || "";
          const d = st.sonar_cm;
          $("sonar").textContent = d == null ? "–" : d > 400 ? "clear" : `${d.toFixed(0)} cm`;
          $("armed").textContent = settings.paused ? "disarmed" : "ARMED";
          $("arm").firstChild.textContent = settings.paused ? "Arm detection" : "Disarm detection";
          $("link").textContent = st.link || "–";
          $("batt").textContent = st.batt_v == null ? "–" : `${st.batt_v.toFixed(1)} V`;
          $("cross").disabled = !["wait", "paused"].includes(st.state);
          if (document.activeElement !== $("timer")) $("timer").value = settings.go_timer_s || "";
          for (const [id, unit] of [
            ["pitch", "°"],
            ["height", " mm"],
            ["shift", " mm"],
          ])
            if (document.activeElement !== $(id) && settings[id] != null) {
              $(id).value = settings[id];
              $(id + "V").textContent = settings[id] + unit;
            }
          $("reverse").checked = !!settings.reverse;
          const table = !!settings.finish_cm;
          $("tableMode").classList.toggle("on", table);
          $("streetMode").classList.toggle("on", !table);
          $("modeInfo").textContent = table
            ? `stops ${settings.finish_cm} cm before the far object · max ${settings.cross_max_s} s`
            : `walks until Stop · max ${settings.cross_max_s} s`;
          $("timerLeft").textContent =
            st.timer_left != null ? `GO in ${st.timer_left.toFixed(1)}` : settings.go_timer_s ? "ready" : "off";
        } catch {
          $("state").textContent = "offline";
          $("state").className = "offline";
        }
        setTimeout(poll, 400);
      }
      poll();
    </script>
  </body>
</html>
